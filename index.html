<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Job Cards</title>
<style>
:root{--bg:#f3f5f4;--surface:#fff;--line:#d5ddd9;--fg:#18211e;--muted:#5b6964;--accent:#0d6b5c;--accent-fg:#fff;--err:#b3261e;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111816;--surface:#18211e;--line:#2d3b37;--fg:#e4ece9;--muted:#9aaba5;--accent:#4cc3aa;--accent-fg:#06231d;--err:#ff8a7f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;display:grid;place-items:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);font-size:14px}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
input[type=password]{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;width:100%}
.row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg)}
button{padding:11px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--err);font-size:14px;min-height:1.2em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Job Cards</h1>
  <p>Доступ только по паролю. Спросите его у ответственного за техническое обслуживание.</p>
  <label>Пароль<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
  <label class="row"><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
  <button type="submit" id="go">Войти</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(CT));
  const txt = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
function show(data, pw){
  const boot = '<script>window.__KARTOCHKI_API__='+JSON.stringify(data.api)+';window.__KARTOCHKI_PW__='+JSON.stringify(pw).replace(/</g,'\\u003c')+';<\/script>';
  const doc = '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>'+boot+data.html+'</body></html>';
  document.open(); document.write(doc); document.close();
}
function saved(){ try{ return localStorage.getItem('kartochki-pw') || sessionStorage.getItem('kartochki-pw'); }catch(e){ return null; } }
async function tryPw(pw, remember){
  const data = await open(pw);
  try{ if(remember) localStorage.setItem('kartochki-pw', pw); else sessionStorage.setItem('kartochki-pw', pw); }catch(e){}
  show(data, pw);
}
const s = saved();
if(s){ tryPw(s, !!localStorage.getItem('kartochki-pw')).catch(()=>{ try{localStorage.removeItem('kartochki-pw');sessionStorage.removeItem('kartochki-pw');}catch(e){} }); }
document.getElementById('f').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const pw = document.getElementById('pw').value, btn = document.getElementById('go'), err = document.getElementById('err');
  if(!pw) return;
  btn.disabled = true; err.textContent = '';
  try{ await tryPw(pw, document.getElementById('rem').checked); }
  catch(e){ btn.disabled = false; err.textContent = 'Неверный пароль. Попробуйте ещё раз.'; }
});
})();
